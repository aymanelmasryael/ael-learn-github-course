<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <filter id="g"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity=".3"/></filter>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="#0d1117"/>
  <text x="300" y="38" fill="#eef2ff" font-family="system-ui,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">The Three States of Git</text>
  <text x="300" y="56" fill="#9ab3e6" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Files move through three states: working → staged → committed</text>
  <rect x="65" y="160" width="130" height="70" rx="12" fill="url(#g0)" filter="url(#g)"/>
  <rect x="65" y="160" width="130" height="70" rx="12" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity=".4"/>
  <text x="130" y="186" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Working Directory</text>
  <rect x="235" y="160" width="130" height="70" rx="12" fill="url(#g1)" filter="url(#g)"/>
  <rect x="235" y="160" width="130" height="70" rx="12" fill="none" stroke="#3fb950" stroke-width="1" stroke-opacity=".4"/>
  <text x="300" y="186" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Staging Area</text>
  <rect x="405" y="160" width="130" height="70" rx="12" fill="url(#g2)" filter="url(#g)"/>
  <rect x="405" y="160" width="130" height="70" rx="12" fill="none" stroke="#d2a8ff" stroke-width="1" stroke-opacity=".4"/>
