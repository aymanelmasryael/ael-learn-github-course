  <text x="470" y="176" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">(Committed)</text>
  <line x1="201" y1="195" x2="229" y2="195" stroke="#58a6ff" stroke-width="2" stroke-opacity=".6"/>
  <polygon points="221,190 229,195 221,200" fill="#58a6ff" fill-opacity=".6"/>
  <text x="215" y="183" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">git add</text>
  <line x1="371" y1="195" x2="399" y2="195" stroke="#58a6ff" stroke-width="2" stroke-opacity=".6"/>
  <polygon points="391,190 399,195 391,200" fill="#58a6ff" fill-opacity=".6"/>
  <text x="385" y="183" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">git commit</text>
  <text x="16" y="346" fill="#58a6ff" font-family="monospace" font-size="10" opacity=".5">m1</text>
